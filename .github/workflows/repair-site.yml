name: Repair site worker

on:
  push:
    paths:
      - '.github/workflows/repair-site.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore good worker and apply review/card patch
        shell: bash
        run: |
          git show 2366f939ccb646d9fb7178469de571a4aa31fa93:worker.js > worker.js
          echo '' | base64 -d | gzip -d > /tmp/repair.patch
          git apply /tmp/repair.patch
          node --check worker.js
      - name: Commit repaired worker
        shell: bash
        run: |
          git config user.name 'dc1993 repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git add worker.js
          git commit -m 'Restore Story Bible sync and align book cards'
          git push
